<!DOCTYPE html>
<html>
<head>

<title>Production Deployment Portal</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0d1117;
color:white;
}

.header{
background:#161b22;
padding:15px;
}

.container{
width:900px;
margin:auto;
margin-top:20px;
}

.card{
background:#161b22;
padding:20px;
margin-top:15px;
}

button{
background:#238636;
color:white;
padding:10px;
border:none;
cursor:pointer;
}

button:hover{
background:#2ea043;
}

.progress{
width:100%;
height:20px;
background:#333;
margin-top:10px;
}

.bar{
height:20px;
width:0%;
background:orange;
}

.success{
background:#238636;
}

.failed{
background:#da3633;
}

#logs{
background:black;
height:350px;
overflow:auto;
padding:10px;
margin-top:10px;
font-size:12px;
}

</style>

</head>

<body>

<div class="header">

🚀 Deployment Portal

</div>


<div class="container">


<div class="card">

<select id="pipeline"></select>

<button onclick="deploy()">Deploy</button>

<button onclick="checkStatus()">Status</button>

<button onclick="startLogs()">Live Logs</button>


<div class="progress">

<div class="bar" id="bar"></div>

</div>


<div id="status"></div>

</div>


<div class="card">

<h3>Console Logs</h3>

<div id="logs"></div>

</div>


</div>


<script>

const URL="https://kenbihqf3eapckd6kcldwd7ndm0prgtx.lambda-url.us-east-1.on.aws/"


let username=localStorage.getItem("username")
let password=localStorage.getItem("password")

let pointer=0
let running=false


// LOAD PIPELINES

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"list"
})
})
.then(res=>res.json())
.then(data=>{
data.forEach(p=>pipeline.add(new Option(p,p)))
})




// DEPLOY

function deploy(){

status.innerHTML="Starting build"

bar.style.width="10%"

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"build",pipeline:pipeline.value
})
})

startLogs()

}



// STATUS

function checkStatus(){

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"status",pipeline:pipeline.value
})
})
.then(res=>res.json())
.then(data=>{

if(data.status=="SUCCESS"){

bar.style.width="100%"
bar.className="bar success"

status.innerHTML="SUCCESS"

}

else if(data.status=="FAILED"){

bar.style.width="100%"
bar.className="bar failed"

status.innerHTML="FAILED"

}

else{

bar.style.width="60%"
status.innerHTML="RUNNING"

}

})

}



// LIVE LOG STREAM

function startLogs(){

pointer=0
logs.innerHTML=""
running=true

stream()

}


function stream(){

if(!running) return


fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,
action:"console",
pipeline:pipeline.value,
start:pointer
})
})
.then(res=>res.json())
.then(data=>{

logs.innerHTML+=data.text

logs.scrollTop=logs.scrollHeight

pointer=data.size

if(data.more=="true")

setTimeout(stream,2000)

else{

running=false

checkStatus()

}

})

}


</script>


</body>
</html>
