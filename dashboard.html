<!DOCTYPE html>
<html>
<head>
<title>Deployment Dashboard</title>

<style>

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
margin:0;
}

.box{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:15px;
box-shadow:0 0 25px cyan;
width:500px;
}

select,button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
}

button{
background:cyan;
font-weight:bold;
cursor:pointer;
}

.progress-container{
width:100%;
background:#333;
border-radius:10px;
margin-top:15px;
}

.progress-bar{
width:0%;
height:20px;
background:orange;
}

#console{
background:black;
margin-top:15px;
padding:10px;
height:200px;
overflow:auto;
font-size:12px;
}

.rocket{
position:absolute;
bottom:-100px;
left:50%;
transform:translateX(-50%);
font-size:60px;
opacity:0;
transition:2s;
}

.launch{
bottom:120%;
opacity:1;
}

</style>
</head>

<body>


<div class="box">

<h2>Deployment Dashboard</h2>

<select id="pipeline"></select>

<button onclick="deploy()">🚀 Deploy</button>

<button onclick="status()">Check Status</button>

<button onclick="consoleLogs()">Console Logs</button>

<button onclick="logout()">Logout</button>


<div class="progress-container">

<div class="progress-bar" id="progressBar"></div>

</div>


<p id="result"></p>

<div id="console"></div>

</div>


<div class="rocket" id="rocket">🚀</div>


<script>

const URL="YOUR_LAMBDA_URL"


let username=localStorage.getItem("username")
let password=localStorage.getItem("password")


// Load pipelines

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"list"
})
})
.then(res=>res.json())
.then(data=>{
data.forEach(p=>{
pipeline.add(new Option(p,p))
})
})




// Deploy

function deploy(){

progressBar.style.width="10%"
progressBar.style.background="orange"

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"build",pipeline:pipeline.value
})
})

}




// Status

function status(){

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"status",pipeline:pipeline.value
})
})
.then(res=>res.json())
.then(data=>{

progressBar.style.width="100%"

if(data.status=="SUCCESS"){

progressBar.style.background="green"

result.innerHTML="Build Success"

launchRocket()

}

else if(data.status=="FAILED"){

progressBar.style.background="red"

result.innerHTML="Build Failed"

}

else{

progressBar.style.background="orange"

result.innerHTML="Build Running"

}

})

}




// Console Logs

function consoleLogs(){

fetch(URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username,password,action:"console",pipeline:pipeline.value
})
})
.then(res=>res.text())
.then(data=>{

console.innerHTML="<pre>"+data+"</pre>"

})

}




// Rocket

function launchRocket(){

rocket.classList.add("launch")

setTimeout(()=>{

rocket.classList.remove("launch")

},3000)

}




function logout(){

localStorage.clear()

window.location="index.html"

}


</script>


</body>
</html>
