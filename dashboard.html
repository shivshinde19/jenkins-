<!DOCTYPE html>
<html>
<head>
<title>Deployment Dashboard</title>

<style>

body{
font-family:Segoe UI;
background:linear-gradient(135deg,#0f2027,#203a43);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
margin:0;
}

.box{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:15px;
box-shadow:0 0 25px cyan;
width:420px;
}

select,button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
}

button{
background:cyan;
font-weight:bold;
cursor:pointer;
}

button:hover{
box-shadow:0 0 15px cyan;
}

/* Progress Bar */

.progress-container{

width:100%;
background:#333;
border-radius:10px;
margin-top:20px;
overflow:hidden;

}

.progress-bar{

width:0%;
height:20px;
background:orange;
transition:width 0.5s;

}

/* Rocket */

.rocket{

position:absolute;
bottom:-100px;
left:50%;
transform:translateX(-50%);
font-size:60px;
transition: all 2s ease;
opacity:0;

}

.launch{

bottom:120%;
opacity:1;

}

</style>

</head>

<body>


<div class="box">

<h2>Deployment Dashboard</h2>

<select id="pipeline"></select>

<button onclick="deploy()">🚀 Deploy</button>

<button onclick="status()">Check Status</button>

<button onclick="logout()">Logout</button>


<div class="progress-container">

<div class="progress-bar" id="progressBar"></div>

</div>


<p id="result"></p>

</div>


<div class="rocket" id="rocket">🚀</div>



<script>

const URL="YOUR_LAMBDA_URL"


let username=localStorage.getItem("username")
let password=localStorage.getItem("password")


if(!username){

window.location="index.html"

}


// Load pipelines

fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"list"

})

})

.then(res=>res.json())

.then(data=>{

data.forEach(p=>{

let option=document.createElement("option")

option.value=p
option.text=p

pipeline.add(option)

})

})




// Deploy Pipeline

function deploy(){

result.innerHTML="Starting Build..."

progressBar.style.width="10%"
progressBar.style.background="orange"


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"build",
pipeline:pipeline.value

})

})

.then(()=>{

checkProgress()

})

}



// Check progress continuously

function checkProgress(){

let progress=20


let interval=setInterval(()=>{


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"status",
pipeline:pipeline.value

})

})

.then(res=>res.json())

.then(data=>{


if(data.status==null){

progress+=10

if(progress<90){

progressBar.style.width=progress+"%"

}

result.innerHTML="Build Running..."

}


else{

clearInterval(interval)


progressBar.style.width="100%"


if(data.status=="SUCCESS"){

progressBar.style.background="green"

result.innerHTML="Build Success"

launchRocket()

}

else{

progressBar.style.background="red"

result.innerHTML="Build Failed"

}


}


})


},3000)


}



// Manual status button

function status(){

checkProgress()

}



// Rocket

function launchRocket(){

rocket.classList.add("launch")

setTimeout(()=>{

rocket.classList.remove("launch")

},3000)

}



// Logout

function logout(){

localStorage.clear()

window.location="index.html"

}


</script>


</body>
</html>
