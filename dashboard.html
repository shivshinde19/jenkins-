<script>

// ✅ FIX 1: Removed extra space from URL

const URL="https://kenbihqf3eapckd6kcldwd7ndm0prgtx.lambda-url.us-east-1.on.aws/"


let username=localStorage.getItem("username")
let password=localStorage.getItem("password")


if(!username){

window.location="index.html"

}



// Load pipelines

fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"list"

})

})

.then(res=>res.json())

.then(data=>{

pipeline.innerHTML=""

data.forEach(p=>{

let option=document.createElement("option")

option.value=p
option.text=p

pipeline.add(option)

})

})




// 🚀 Deploy Pipeline

function deploy(){

result.innerHTML="⏳ Starting Build..."

progressBar.style.width="10%"
progressBar.style.background="orange"


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"build",
pipeline:pipeline.value

})

})

.then(()=>{

checkProgress()

})

}




// ✅ FIXED progress checker

function checkProgress(){

let progress=20


let interval=setInterval(()=>{


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"status",
pipeline:pipeline.value

})

})

.then(res=>res.json())

.then(data=>{


if(data.status==null){

if(progress<90){

progress+=10

progressBar.style.width=progress+"%"

}

result.innerHTML="⏳ Build Running..."

}


else{


clearInterval(interval)


progressBar.style.width="100%"


if(data.status=="SUCCESS"){

progressBar.style.background="green"

result.innerHTML="✅ Build Success"

launchRocket()

}


else if(data.status=="FAILED"){

progressBar.style.background="red"

result.innerHTML="❌ Build Failed"

}

else{

progressBar.style.background="orange"

result.innerHTML="⏳ Still Running"

}


}


})


},3000)

}




// ✅ FIX 2: Proper status button

function status(){

result.innerHTML="Checking Status..."

progressBar.style.width="40%"
progressBar.style.background="orange"


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:username,
password:password,
action:"status",
pipeline:pipeline.value

})

})

.then(res=>res.json())

.then(data=>{


progressBar.style.width="100%"


if(data.status=="SUCCESS"){

progressBar.style.background="green"

result.innerHTML="✅ Build Success"

launchRocket()

}

else if(data.status=="FAILED"){

progressBar.style.background="red"

result.innerHTML="❌ Build Failed"

}

else{

progressBar.style.background="orange"

result.innerHTML="⏳ Build Running"

}

})

}




// Rocket

function launchRocket(){

rocket.classList.add("launch")

setTimeout(()=>{

rocket.classList.remove("launch")

},3000)

}




// Logout

function logout(){

localStorage.clear()

window.location="index.html"

}


</script>
