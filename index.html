<!DOCTYPE html>
<html>
<head>

<title>Deployment Portal</title>

<style>

/* Background */

body{
margin:0;
font-family:Segoe UI;
background: linear-gradient(135deg,#141e30,#243b55);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow:hidden;
}


/* Container */

.container{

background: rgba(255,255,255,0.05);
padding:30px;
border-radius:15px;
backdrop-filter: blur(20px);
width:400px;
box-shadow:0 0 30px cyan;

}


/* Inputs */

input, select{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
background:rgba(255,255,255,0.1);
color:transparent;   /* hidden text */
text-shadow:0 0 0 transparent;

}


/* Show text on hover */

select:hover{

color:white;

}


/* Button */

button{

width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
background: linear-gradient(90deg,#00ffe7,#00c3ff);
cursor:pointer;
font-weight:bold;

}


button:hover{

box-shadow:0 0 20px cyan;
transform:scale(1.05);

}


/* Rocket */

.rocket{

position:absolute;
bottom:-200px;
left:50%;
font-size:60px;
transition: all 2s ease;
opacity:0;

}


/* Launch animation */

.launch{

bottom:110%;
opacity:1;

}


/* Status */

#result{

margin-top:15px;

}

</style>

</head>

<body>


<div class="container">


<h2>Deployment Dashboard</h2>


<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">


<select id="pipeline"></select>


<button onclick="deploy()">🚀 Deploy</button>


<div id="result"></div>


</div>


<div class="rocket" id="rocket">🚀</div>


<script>


const URL="https://kenbihqf3eapckd6kcldwd7ndm0prgtx.lambda-url.us-east-1.on.aws/"


let USER=""

let PASS=""


// Load pipelines automatically

window.onload=function(){

USER=prompt("Enter Username")

PASS=prompt("Enter Password")


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:USER,
password:PASS,
action:"list"

})

})

.then(res=>res.json())

.then(data=>{


data.forEach(p=>{

let option=document.createElement("option")
option.value=p
option.text=p
pipeline.add(option)

})


})

}



// Deploy function

function deploy(){


result.innerHTML="⏳ Building..."


fetch(URL,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

username:USER,
password:PASS,
action:"build",
pipeline:pipeline.value

})

})

.then(res=>res.text())

.then(data=>{


result.innerHTML="✅ Build Success"


launchRocket()


})


}



// Rocket animation

function launchRocket(){


let rocket=document.getElementById("rocket")


rocket.classList.add("launch")


setTimeout(()=>{

rocket.classList.remove("launch")

},3000)


}


</script>


</body>

</html>
